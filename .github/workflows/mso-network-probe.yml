name: MSO Network Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Download DCCEEW workbook from macOS runner
        run: |
          curl -fLsS --http1.1 --connect-timeout 10 --max-time 45 \
            -o /tmp/mso-workbook.xlsx -w 'status=%{http_code} bytes=%{size_download}\n' \
            'https://www.dcceew.gov.au/sites/default/files/documents/mso-weekly-snapshot-timeseries.xlsx'
          file /tmp/mso-workbook.xlsx

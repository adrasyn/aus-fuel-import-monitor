name: MSO Network Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install selenium
      - name: Read DCCEEW public report in headless Chrome
        run: |
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          driver = webdriver.Chrome(options=options)
          try:
              driver.set_page_load_timeout(60)
              driver.get("https://app.powerbi.com/view?r=eyJrIjoiMzcyZmE4ZjgtOGRjNy00NGM3LWExYTktMTk2NzU2NWEzNzkzIiwidCI6IjhjM2M4MWJjLTJiM2MtNDRhZi1iM2Y3LTZmNjIwYjM5MTBlZSJ9")
              text = WebDriverWait(driver, 90).until(lambda d: (
                  value if "Days of stocks at normal rate of consumption" in (
                      value := d.find_element(By.TAG_NAME, "body").text
                  ) and "Gasoline" in value else False
              ))
              print(text[:2000])
          finally:
              driver.quit()
          PY

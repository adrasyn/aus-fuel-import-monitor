name: MSO Network Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test DCCEEW spreadsheet download
        shell: bash
        run: |
          curl -fLsS --connect-timeout 10 --max-time 60 \
            -H 'X-No-Cache: true' \
            -o /tmp/mso-reader.txt \
            -w 'status=%{http_code} bytes=%{size_download} seconds=%{time_total}\n' \
            'https://r.jina.ai/https://www.dcceew.gov.au/sites/default/files/documents/mso-weekly-snapshot-timeseries.xlsx'
          wc -c /tmp/mso-reader.txt
          grep -E '^# \[Sheet [456]:|^\*\*9/15/2026\*\*' /tmp/mso-reader.txt
